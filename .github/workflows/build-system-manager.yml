---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
jobs:
  build-sootopolis:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: alyraffauf
      - name: Build sootopolis
        run: >-
          nix build --accept-flake-config --print-out-paths
          .#systemConfigs.sootopolis
name: build-system-manager
'on':
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - _img/**
  workflow_dispatch: {}
