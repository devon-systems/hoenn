concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
jobs:
  check-flake:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: alyraffauf
    - name: Check flake evaluation
      run: nix -Lv flake check
    - name: Check Flux release bundle
      run: nix run .#check-k8s -- --flux-bundle-only
name: check-nix
'on':
  pull_request:
  push:
    branches:
    - master
    paths-ignore:
    - '**/*.md'
    - _img/**
  workflow_dispatch: {}
