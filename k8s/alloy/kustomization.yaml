apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - repository.yaml
  - release.yaml
  - kube-state-metrics.yaml
configMapGenerator:
  - name: alloy-config-values
    namespace: flux-system
    files:
      - config.alloy
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
