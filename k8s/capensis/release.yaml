apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capensis
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/capensis
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: capensis
  targetNamespace: capensis
  upgrade:
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
    writeInterval: 10s
    identifier: aly.codes
    pds:
      - pds.wsocial.network
    existingSecret: capensis
    image:
      tag: sha-6115f76edbcbd2fd9c266950f0ac3e3c6c892c19@sha256:07fccea4edacf2e519a57ea0e8aca4dd09aaa5dc6de4c5750b6b3280666cf0be
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
