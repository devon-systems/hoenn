apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capensis
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/capensis
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: capensis
  targetNamespace: capensis
  upgrade:
    remediation:
      retries: 3
  values:
    identifier: aly.codes
    pds:
      - northsky.social
    existingSecret: capensis
    image:
      tag: sha-af7cc226e1ca6844a5cf5bfb7b3f7a71694a0e5b@sha256:39e3020bcc9d12facfe8e8849daeef7766ab06fd822d521eb78294c1ab7800b2
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
