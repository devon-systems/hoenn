apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capensis
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/capensis
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: capensis
  targetNamespace: capensis
  upgrade:
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
    writeInterval: 10s
    identifier: aly.codes
    pds:
      - pds.wsocial.network
    existingSecret: capensis
    image:
      tag: sha-6bc882d46293b9fdfd9976c9ee2eb6a2690faec2@sha256:7b1d0116481cfeea2c1a45b37f2dc34af2a4b5a32afdc406e53c19b80f75e550
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
