apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capensis
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/capensis
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: capensis
  targetNamespace: capensis
  upgrade:
    remediation:
      retries: 3
  values:
    identifier: aly.codes
    pds:
      - northsky.social
      - pds.wsocial.network
    existingSecret: capensis
    image:
      tag: sha-93af83db1d9a70736f4dbac0f0fb5676e3ee6d7d@sha256:2dd5ae0efb3e16a2d8f2a7b6e48acd93f3be09f39afd82fd6afc82bf78f00fec
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
