apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capensis
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/capensis
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: capensis
  targetNamespace: capensis
  upgrade:
    remediation:
      retries: 3
  values:
    writeInterval: 10s
    identifier: aly.codes
    pds:
      - pds.wsocial.network
    existingSecret: capensis
    image:
      tag: sha-b07e83586b252a4fd758d390228d5076ebcecfdf@sha256:f61d4ffcdbd52cda2bd2e021a2513ab210a0903af013b0058a6d213483353e6d
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
