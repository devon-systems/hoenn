{{- if empty .Values.pds }}
{{- fail "pds must contain at least one PDS" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-capensis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: capensis
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capensis
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.metrics.port | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capensis
          image: {{ printf "%v:%v" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          {{- end }}
          args:
            {{- if .Values.metrics.enabled }}
            - {{ printf "--metrics-address=:%v" .Values.metrics.port | quote }}
            {{- end }}
            - --database=/data/capensis.sqlite
            - {{ printf "--identifier=%v" (required "identifier is required" .Values.identifier) | quote }}
            - {{ printf "--slingshot=%v" .Values.slingshot | quote }}
            - {{ printf "--jetstream=%v" .Values.jetstream | quote }}
            - {{ printf "--write-interval=%s" (regexReplaceAll "^([0-9]+)$" (toString .Values.writeInterval) "${1}s") | quote }}
            - {{ printf "--rescan-interval=%s" (regexReplaceAll "^([0-9]+)$" (toString .Values.rescanInterval) "${1}s") | quote }}
            {{- if .Values.loginPDS }}
            - {{ printf "--login-pds=%v" .Values.loginPDS | quote }}
            {{- end }}
            {{- range $pds := required "pds must contain at least one PDS" .Values.pds }}
            - {{ printf "--pds=%v" $pds | quote }}
            {{- end }}
            {{- range $pds, $uri := .Values.lists }}
            - {{ printf "--list=%v=%v" $pds $uri | quote }}
            {{- end }}
          env:
            - name: CAPENSIS_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret | quote }}
                  key: {{ .Values.passwordKey | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%v-capensis" .Release.Name) .Values.persistence.existingClaim }}
        - name: tmp
          emptyDir: {}
