{{- if .Values.metrics.enabled }}
{{- $suffix := "-capensis-metrics" }}
{{- $name := printf "%s%s" .Release.Name $suffix }}
{{- if gt (len $name) 63 }}
{{- $hash := sha256sum .Release.Name | trunc 10 }}
{{- $prefixLength := int (sub 63 (add (len $suffix) (len $hash) 1)) }}
{{- $name = printf "%s-%s%s" (trunc $prefixLength .Release.Name) $hash $suffix }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: capensis
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
