{{- if and (empty .Values.accounts) (empty .Values.clusters) }}
{{- fail "configure accounts or clusters" }}
{{- end }}
{{- if and .Values.accounts (hasKey .Values.clusters "default") }}
{{- fail "accounts and clusters.default both configure the default cluster" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-trifolium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trifolium
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trifolium
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trifolium
          image: {{ printf "%v:%v" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --database=/data/trifolium.sqlite
            - {{ printf "--identifier=%v" (required "identifier is required" .Values.identifier) | quote }}
            - {{ printf "--constellation=%v" .Values.constellation | quote }}
            - {{ printf "--slingshot=%v" .Values.slingshot | quote }}
            - {{ printf "--jetstream=%v" .Values.jetstream | quote }}
            - {{ printf "--write-interval=%s" (regexReplaceAll "^([0-9]+)$" (toString .Values.writeInterval) "${1}s") | quote }}
            - {{ printf "--rescan-interval=%s" (regexReplaceAll "^([0-9]+)$" (toString .Values.rescanInterval) "${1}s") | quote }}
            {{- with .Values.clusters }}
            - {{ printf "--clusters=%s" (mustToJson .) | quote }}
            {{- end }}
            - {{ printf "--accounts=%s" (join "," .Values.accounts) | quote }}
            - {{ printf "--threshold=%v" .Values.threshold | quote }}
          env:
            - name: TRIFOLIUM_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret | quote }}
                  key: {{ .Values.passwordKey | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%v-trifolium" .Release.Name) .Values.persistence.existingClaim }}
        - name: tmp
          emptyDir: {}
