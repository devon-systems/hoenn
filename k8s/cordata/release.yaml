apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cordata
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/cordata
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: cordata
  targetNamespace: cordata
  upgrade:
    remediation:
      retries: 3
  values:
    identifier: aly.codes
    # https://bsky.app/profile/transnews.network/post/3n2ou3neu5c2h
    post: at://did:plc:gm2gj4v7isgrlsww3ya7hpy2/app.bsky.feed.post/3n2ou3neu5c2h
    existingSecret: cordata
    image:
      tag: sha-90acb03db3f53a1850a33bac67bf1c1d9031d899@sha256:839972d872f3c883fe334c20f841fffb2489753db989397f30a9e0d14930581b
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    nodeSelector:
      kubernetes.io/hostname: mauville
