      # https://bsky.app/profile/transnews.network/post/3n2mn47tqtk2e
      - at://did:plc:gm2gj4v7isgrlsww3ya7hpy2/app.bsky.feed.post/3n2mn47tqtk2e
      # https://bsky.app/profile/mady.cat/post/3n2z7oowtsc2w
      - at://did:plc:3qydk2zg25crp4yalkdvbzc4/app.bsky.feed.post/3n2z7oowtsc2w
      # https://bsky.app/profile/mady.cat/post/3n33ksyv5sk2x
      - at://did:plc:3qydk2zg25crp4yalkdvbzc4/app.bsky.feed.post/3n33ksyv5sk2x
      # https://parfait.social/did:plc:z26yzeduq24ma5ym7uer3i5w/post/3n3au24ia5k22
      - at://did:plc:z26yzeduq24ma5ym7uer3i5w/app.bsky.feed.post/3n3au24ia5k22
    existingSecret: cordata
    image:
      tag: sha-2680038ae800e7c432b5d596ff50c5628c17b2a8@sha256:a81393c2a9c447c4ae8e711c3e5c40ddf850dca14a87c79234bece2adae4db56
