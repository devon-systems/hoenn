apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cordata
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/cordata
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: cordata
  targetNamespace: cordata
  upgrade:
    remediation:
      retries: 3
  values:
    identifier: aly.codes
    # https://bsky.app/profile/transnews.network/post/3n2ou3neu5c2h
    post: at://did:plc:gm2gj4v7isgrlsww3ya7hpy2/app.bsky.feed.post/3n2ou3neu5c2h
    existingSecret: cordata
    image:
      tag: sha-a870596b2f598662b1016c518b3f3c4dda623ee3@sha256:71a7d30d743ee06b1b61c9fda5e15bc6e1273a12f5bfd688ab377bb70757344f
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    nodeSelector:
      kubernetes.io/hostname: mauville
