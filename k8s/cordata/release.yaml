apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cordata
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/cordata
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: cordata
  targetNamespace: cordata
  upgrade:
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
    identifier: aly.codes
    posts:
      # https://bsky.app/profile/transnews.network/post/3n2ou3neu5c2h
