apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homebridge
  namespace: flux-system
spec:
  dependsOn:
    - name: tailscale-private-ingress
  interval: 10m
  retryInterval: 1m
  path: ./k8s/homebridge
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
