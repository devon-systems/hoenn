apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-private-ingress
  namespace: flux-system
spec:
  dependsOn:
    - name: tailscale
  interval: 10m
  path: ./k8s/tailscale-private-ingress
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
