apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helix
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/helix
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: helix
  targetNamespace: helix
  upgrade:
    remediation:
      retries: 3
  values:
    writeInterval: 10s
    identifier: aly.codes
    accounts:
      # bella.meangirls.online; the DID keeps tracking the same account after handle changes.
      - did:plc:bucg2dsfr66ecm7kc3bmepwv
      # regretagarbo.rip
      - did:plc:fj7spazyhgkb3vuziubykii3
    existingSecret: helix
    image:
      tag: sha-03bf51fa58a73dafde7b8c738956c6260eee32ef@sha256:39accc57e566edd821c58542c5c090a113233ad8d74ef22a66d4902fbcf80314
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
