apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helix
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/helix
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: helix
  targetNamespace: helix
  upgrade:
    remediation:
      retries: 3
  values:
    identifier: aly.codes
    accounts:
      # bella.meangirls.online; the DID keeps tracking the same account after handle changes.
      - did:plc:bucg2dsfr66ecm7kc3bmepwv
      # regretagarbo.rip
      - did:plc:fj7spazyhgkb3vuziubykii3
    existingSecret: helix
    image:
      tag: sha-a4ba67cf8bc6a734ae247d209f8709ebd52afb4b@sha256:51e59b720281780cefae4de5c4ce8013944be21a6786cfab29e45baf3a7da2b0
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
