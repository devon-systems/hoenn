apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helix
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/helix
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: helix
  targetNamespace: helix
  upgrade:
    remediation:
      retries: 3
  values:
    identifier: aly.codes
    accounts:
      # bella.meangirls.online; the DID keeps tracking the same account after handle changes.
      - did:plc:bucg2dsfr66ecm7kc3bmepwv
      # regretagarbo.rip
      - did:plc:fj7spazyhgkb3vuziubykii3
    existingSecret: helix
    image:
      tag: sha-93af83db1d9a70736f4dbac0f0fb5676e3ee6d7d@sha256:78101b89a463ecbfff3f6df0f24bb5b0e357ecd02e3bb2e685f29dcb09cbe7b6
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
