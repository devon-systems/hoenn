apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helix
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/helix
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 30m
  releaseName: helix
  targetNamespace: helix
  upgrade:
    remediation:
      retries: 3
  values:
    writeInterval: 10s
    identifier: aly.codes
    accounts:
      # bella.meangirls.online; the DID keeps tracking the same account after handle changes.
      - did:plc:bucg2dsfr66ecm7kc3bmepwv
      # regretagarbo.rip
      - did:plc:fj7spazyhgkb3vuziubykii3
      # lydz.eurosky.social
      - did:plc:v3qorfocg77vzo6ymiwk7mk4
      # resolutecourier.northsky.social
      - did:plc:6y7fuo55m6utvzlijcsfxow6
      # burnterra.eurosky.social
      - did:plc:itc7behos32kcnnocbkhcowb
      # glamgothcollective.mu.social
      - did:plc:hhomwoom4rlzbputb6b7zsem
      # interdiction.bsky.social
      - did:plc:oebpsglaakip7afvovlzcrwa
      # chironseye.bsky.social
      - did:plc:myzrkp3s4ixagxtgupnvtaks
      # mayoboy.myatproto.social
      - did:plc:og6fbmygrpmkwjhx6uj6rnpl
    existingSecret: helix
    image:
      tag: sha-c0abed903b8cff0138709c7fb2db4b71d3d1466a@sha256:6f8f4d24c049b065312ace34a7f6fbecd6938ea625cca48b459d285f3653dbac
      pullPolicy: IfNotPresent
    persistence:
      size: 1Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    jetstream: wss://jetstream.waow.tech
    nodeSelector:
      kubernetes.io/hostname: mauville
