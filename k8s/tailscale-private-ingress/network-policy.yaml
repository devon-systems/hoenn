# Keep peer UDP independent of the generated listening port and client NAT ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-ingress
  namespace: tailscale
spec:
  podSelector:
    matchLabels:
      tailscale.com/managed: "true"
      tailscale.com/parent-resource-type: proxygroup
      tailscale.com/parent-resource: private-ingress
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - protocol: UDP
